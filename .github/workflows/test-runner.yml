name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          rm -rf /home/ubuntu/app/*
          cp -r . /home/ubuntu/app/

      - name: Verify deployment
        run: |
          echo "===== DEPLOYED FILES ====="
          ls -la /home/ubuntu/app
          echo "===== DEPLOYMENT COMPLETE ====="
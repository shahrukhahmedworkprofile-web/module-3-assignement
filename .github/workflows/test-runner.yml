name: Node.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run check

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            ./ /home/ubuntu/app/

      - name: Install production dependencies
        working-directory: /home/ubuntu/app
        run: npm ci --omit=dev

      - name: Restart application
        run: sudo systemctl restart node-app

      - name: Verify deployment
        run: |
          sleep 3
          sudo systemctl status node-app --no-pager
          curl -f http://localhost:3000/api
name: Node.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run check

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          rm -rf /home/ubuntu/app/*
          cp -r . /home/ubuntu/app/

      - name: Verify deployment
        run: |
          ls -la /home/ubuntu/app
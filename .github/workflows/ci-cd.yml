name: Node.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: [self-hosted, private-ec2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests and capture results
        run: |
          npm run check 2>&1 | tee test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

    deploy:
    name: Deploy Application
    needs: test
    runs-on: [self-hosted, private-ec2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Display test results
        run: |
          echo "===== TEST RESULTS ====="
          cat test-results/test-results.txt
          echo "===== END TEST RESULTS ====="

      - name: Deploy application files
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            ./ /home/ubuntu/app/module-3-assignement/

      - name: Install production dependencies
        working-directory: /home/ubuntu/app/module-3-assignement
        run: npm ci

      - name: Restart Node.js application
        run: sudo systemctl restart node-app

      - name: Verify application
        run: |
          sleep 2
          sudo systemctl is-active --quiet node-app
          curl -f http://localhost:3000/api